<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sage · Your Study Companion</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbf6ec;--card:#fffdf8;--ink:#3b3a36;--soft:#8a867b;--sage:#7fa88b;--sage-d:#4f7d5f;--peach:#f6c9a8;--sky:#cfe3ee;--butter:#f7e4a1;--line:#eadfca;--r:18px}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font:16px/1.6 Nunito,system-ui,sans-serif;color:var(--ink);background:var(--paper);background-image:radial-gradient(#eadfca 1px,transparent 1px);background-size:22px 22px}
h1,h2,h3{font-family:Fraunces,Georgia,serif}
button{font:inherit;cursor:pointer;border:0;color:inherit}input,textarea,select{font:inherit;color:inherit}
.hide{display:none!important}
/* auth */
#auth{min-height:100%;display:grid;place-items:center;padding:20px}
.authcard{background:var(--card);border:2px solid var(--line);border-radius:28px;padding:34px;width:min(420px,100%);box-shadow:8px 8px 0 var(--peach)}
.authcard h1{font-size:2rem;line-height:1.15}.authcard p{color:var(--soft);margin:6px 0 20px}
.authcard input{width:100%;padding:12px 14px;margin-bottom:10px;border:2px solid var(--line);border-radius:12px;background:#fff}
.authcard input:focus,textarea:focus{outline:0;border-color:var(--sage)}
.btn{background:var(--sage-d);color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;transition:.15s}.btn:hover{transform:translateY(-2px)}
.link{background:none;color:var(--sage-d);text-decoration:underline;margin-top:14px;display:block}
.err{background:#fde3dc;color:#a3412b;border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.9rem}
/* app */
#app{display:grid;grid-template-columns:280px 1fr;height:100%}
aside{background:#f3ead7;border-right:2px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.brand{display:flex;gap:10px;align-items:center}.brand span{font-size:1.8rem}.brand h2{font-size:1.4rem}
.new{background:var(--butter);padding:11px;border-radius:14px;font-weight:700;border:2px dashed #d9b84f}
#convs{display:flex;flex-direction:column;gap:6px;flex:1}
.conv{display:flex;justify-content:space-between;gap:6px;padding:9px 12px;border-radius:12px;background:transparent;text-align:left;width:100%}
.conv:hover,.conv.on{background:var(--card)}.conv small{color:var(--soft)}.conv b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot{font-size:.85rem;color:var(--soft);display:flex;justify-content:space-between;align-items:center}
main{display:flex;flex-direction:column;min-width:0;height:100%}
header{padding:14px 22px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.menu{display:none;background:var(--card);border-radius:10px;padding:6px 12px;border:2px solid var(--line)}
.levels{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:99px;border:2px solid var(--line)}
.levels button{padding:5px 14px;border-radius:99px;background:none;font-weight:600;font-size:.9rem}
.levels button.on{background:var(--sage);color:#fff}
#feed{flex:1;overflow:auto;padding:10px 22px 20px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.hello{margin:auto;text-align:center;max-width:520px}.hello .big{font-size:3rem}
.hello h1{font-size:2rem;margin:6px 0}.hello p{color:var(--soft)}
.ideas{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.ideas button{background:var(--card);border:2px solid var(--line);padding:7px 14px;border-radius:99px}.ideas button:hover{border-color:var(--sage)}
.msg{max-width:min(760px,100%);padding:14px 18px;border-radius:var(--r);word-wrap:break-word}
.me{align-self:flex-end;background:var(--sky);border-bottom-right-radius:4px}
.ai{align-self:flex-start;background:var(--card);border:2px solid var(--line);border-bottom-left-radius:4px}
.ai h1,.ai h2,.ai h3{font-size:1.1rem;margin:12px 0 4px;color:var(--sage-d)}.ai ul,.ai ol{padding-left:22px}.ai code{background:#f3ead7;padding:1px 6px;border-radius:6px}
.ai p{margin:6px 0}.ai li.task{list-style:none;margin-left:-20px}
.spoiler{display:block;margin:4px 0 10px;padding:6px 12px;border-radius:10px;background:var(--butter);cursor:pointer;color:transparent;text-shadow:0 0 0 transparent;position:relative;user-select:none}
.spoiler::before{content:"👀 Tap to reveal answer";color:#7a6420;position:absolute;left:12px}.spoiler.open{color:var(--ink);user-select:text}.spoiler.open::before{content:""}
.tools{display:flex;gap:8px;margin-top:10px}.tools button{font-size:.8rem;background:#f3ead7;padding:4px 10px;border-radius:99px}
.typing{display:flex;gap:5px;padding:4px}.typing i{width:9px;height:9px;border-radius:50%;background:var(--sage);animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-6px);opacity:.5}}
footer{padding:10px 22px calc(14px + env(safe-area-inset-bottom));}
.modes{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.modes button{white-space:nowrap;padding:7px 14px;border-radius:99px;background:var(--card);border:2px solid var(--line);font-weight:600}
.modes button.on{background:var(--peach);border-color:#e9a878}
.box{display:flex;gap:8px;align-items:flex-end;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:8px}
textarea{flex:1;border:0;background:none;resize:none;max-height:140px;padding:8px 10px}
.icon{width:42px;height:42px;border-radius:50%;background:#f3ead7;font-size:1.1rem}.send{background:var(--sage-d);color:#fff}
.doc{font-size:.8rem;background:var(--butter);padding:3px 10px;border-radius:99px}
@media(max-width:760px){#app{grid-template-columns:1fr}aside{position:fixed;inset:0 25% 0 0;z-index:5;transform:translateX(-101%);transition:.25s;box-shadow:6px 0 20px #0003}aside.open{transform:none}.menu{display:block}#feed{padding:8px 12px}header,footer{padding-left:12px;padding-right:12px}}
@media print{aside,footer,header,.tools{display:none}#app{display:block}#feed{overflow:visible}}
</style></head><body>

<section id="auth"><div class="authcard">
<h1>🌱 Hi, I'm Sage.</h1><p id="ap">Log in to pick up your study sessions.</p>
<div id="aerr" class="err hide"></div>
<input id="an" placeholder="Your name" class="hide"><input id="ae" type="email" placeholder="Email"><input id="apw" type="password" placeholder="Password (6+ characters)">
<button class="btn" id="ago" style="width:100%">Log in</button>
<button class="link" id="aswap">New here? Create an account</button></div></section>

<div id="app" class="hide">
<aside id="side"><div class="brand"><span>🌱</span><h2>Sage</h2></div>
<button class="new" id="newc">＋ New study session</button>
<div id="convs"></div>
<div class="foot"><span id="who"></span><button class="link" id="out" style="margin:0">Log out</button></div></aside>
<main>
<header><div style="display:flex;gap:10px;align-items:center"><button class="menu" id="menu">☰</button><span id="docbadge" class="doc hide"></span></div>
<div class="levels" id="levels"><button class="on">Beginner</button><button>Intermediate</button><button>Advanced</button></div></header>
<div id="feed"></div>
<footer><div class="modes" id="modes">
<button class="on" data-m="explain">💡 Explain</button><button data-m="notes">📝 Notes</button><button data-m="quiz">🎯 Quiz me</button><button data-m="plan">🗓️ Study plan</button><button data-m="chat">💬 Just chat</button></div>
<div class="box"><button class="icon" id="upb" title="Upload a .txt or .pdf">📎</button><input type="file" id="file" accept=".txt,.md,.pdf" class="hide">
<textarea id="inp" rows="1" placeholder="What are we learning today?"></textarea><button class="icon send" id="send">➤</button></div></footer></main></div>

<script>
const $=s=>document.querySelector(s);let token=localStorage.t,conv=null,mode='explain',level='Beginner',reg=false,busy=false;
const api=async(u,o={})=>{const r=await fetch('/api'+u,{...o,headers:{...(o.body instanceof FormData?{}:{'Content-Type':'application/json'}),Authorization:'Bearer '+token}});
 const d=await r.json().catch(()=>({error:'Unexpected server response'}));if(r.status===401&&token){logout()}if(!r.ok)throw Error(d.error||'Something went wrong');return d};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function md(t){let h=esc(t).replace(/\|\|([\s\S]*?)\|\|/g,'<span class="spoiler" onclick="this.classList.toggle(\'open\')">$1</span>')
 .replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^#{1,2} (.*)$/gm,'<h2>$1</h2>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`(.+?)`/g,'<code>$1</code>')
 .replace(/^- \[( |x)\] (.*)$/gm,'<li class="task">$1<input type="checkbox"> $2</li>'.replace('$1','')).replace(/^[-*] (.*)$/gm,'<li>$1</li>').replace(/^\d+\. (.*)$/gm,'<li>$1</li>');
 return h.split(/\n{2,}/).map(p=>/^<(h|li)/.test(p)?p.replace(/(<li[\s\S]*<\/li>)/,'<ul>$1</ul>'):'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('')}
/* auth */
function show(){const on=!!token;$('#auth').classList.toggle('hide',on);$('#app').classList.toggle('hide',!on);if(on){$('#who').textContent='👋 '+(localStorage.n||'');loadConvs()}}
function logout(){localStorage.clear();token=null;show()}
$('#out').onclick=logout;
$('#aswap').onclick=()=>{reg=!reg;$('#an').classList.toggle('hide',!reg);$('#ago').textContent=reg?'Create account':'Log in';$('#aswap').textContent=reg?'Have an account? Log in':'New here? Create an account';$('#ap').textContent=reg?'Let\'s set up your study space.':'Log in to pick up your study sessions.'};
$('#ago').onclick=async()=>{const b=$('#ago');b.disabled=true;$('#aerr').classList.add('hide');
 try{const d=await api(reg?'/register':'/login',{method:'POST',body:JSON.stringify({name:$('#an').value,email:$('#ae').value,password:$('#apw').value})});
  token=localStorage.t=d.token;localStorage.n=d.name;show()}catch(e){$('#aerr').textContent=e.message;$('#aerr').classList.remove('hide')}b.disabled=false};
/* conversations */
async function loadConvs(sel){const l=await api('/conversations');$('#convs').innerHTML=l.map(c=>`<button class="conv ${c.id==conv?'on':''}" data-id="${c.id}"><b>${esc(c.title)}</b><small data-del="${c.id}">✕</small></button>`).join('');
 if(sel||(!conv&&l.length))open(sel||l[0].id);else if(!l.length)welcome()}
$('#convs').onclick=async e=>{const d=e.target.dataset.del;if(d){if(confirm('Delete this session?')){await api('/conversations/'+d,{method:'DELETE'});if(conv==d)conv=null;loadConvs()}return}
 const b=e.target.closest('.conv');if(b)open(+b.dataset.id)};
$('#newc').onclick=async()=>{const {id}=await api('/conversations',{method:'POST'});conv=null;loadConvs(id)};
function welcome(){$('#feed').innerHTML=`<div class="hello"><div class="big">📚</div><h1>What shall we learn today?</h1><p>Type any topic. I'll explain it, make notes, quiz you, or plan your revision — at your pace.</p>
<div class="ideas">${['Photosynthesis','Binary search trees','French Revolution','Newton\'s laws'].map(t=>`<button onclick="inp.value='${t}';inp.focus()">${t}</button>`).join('')}</div></div>`}
async function open(id){conv=id;$('#side').classList.remove('open');document.querySelectorAll('.conv').forEach(b=>b.classList.toggle('on',b.dataset.id==id));
 const ms=await api(`/conversations/${id}/messages`);const f=$('#feed');f.innerHTML='';if(!ms.length)welcome();ms.forEach(m=>add(m.role,m.content,m.mode));
 const c=(await api('/conversations')).find(c=>c.id==id);$('#docbadge').classList.toggle('hide',!c?.doc_name);$('#docbadge').textContent='📄 '+(c?.doc_name||'')}
function add(role,text,m){$('.hello')?.remove();const d=document.createElement('div');d.className='msg '+(role==='user'?'me':'ai');
 if(role==='user')d.textContent=text;else{d.innerHTML=md(text)+`<div class="tools"><button onclick="dl(this)">⬇ Export .md</button><button onclick="window.print()">🖨 Print / PDF</button><button onclick="navigator.clipboard.writeText(this.closest('.msg').dataset.raw);this.textContent='Copied ✓'">Copy</button></div>`;d.dataset.raw=text}
 $('#feed').append(d);$('#feed').scrollTop=1e9;return d}
window.dl=b=>{const t=b.closest('.msg').dataset.raw,a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/markdown'}));a.download='study-'+Date.now()+'.md';a.click()};
/* chat */
async function send(){const t=inp.value.trim();if(!t||busy)return;busy=true;
 if(!conv){conv=(await api('/conversations',{method:'POST'})).id}
 inp.value='';inp.style.height='';add('user',t);const w=add('ai','');w.innerHTML='<div class="typing"><i></i><i></i><i></i></div>';
 try{const d=await api(`/conversations/${conv}/chat`,{method:'POST',body:JSON.stringify({message:t,mode,level})});w.remove();add('assistant',d.reply,mode);loadConvs()}
 catch(e){w.innerHTML=`<div class="err">😕 ${esc(e.message)}</div><button class="btn" onclick="inp.value=${esc(JSON.stringify(t)).replace(/"/g,'&quot;')};this.parentNode.remove()">Try again</button>`}busy=false}
$('#send').onclick=send;const inp=$('#inp');
inp.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};inp.oninput=()=>{inp.style.height='auto';inp.style.height=inp.scrollHeight+'px'};
$('#modes').onclick=e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;document.querySelectorAll('#modes button').forEach(x=>x.classList.toggle('on',x===b));
 inp.placeholder={explain:'Enter a topic to explain…',notes:'Topic to turn into notes…',quiz:'Topic for your quiz…',plan:'Topic + timeframe, e.g. "Calculus in 10 days"',chat:'Ask anything about your material…'}[mode]};
$('#levels').onclick=e=>{const b=e.target.closest('button');if(!b)return;level=b.textContent;document.querySelectorAll('#levels button').forEach(x=>x.classList.toggle('on',x===b))};
$('#upb').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!conv)conv=(await api('/conversations',{method:'POST'})).id;
 const fd=new FormData();fd.append('file',f);const n=add('ai','');n.textContent='📎 Reading '+f.name+'…';
 try{await api(`/conversations/${conv}/upload`,{method:'POST',body:fd});n.textContent='✅ Got it! Ask me anything about '+f.name+' — try "Just chat", "Notes" or "Quiz me".';$('#docbadge').textContent='📄 '+f.name;$('#docbadge').classList.remove('hide')}
 catch(err){n.innerHTML=`<div class="err">${esc(err.message)}</div>`}e.target.value=''};
$('#menu').onclick=()=>$('#side').classList.toggle('open');
show();
</script></body></html>
